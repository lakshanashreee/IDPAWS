default:
  tags:
    - windows
  image: maven:3.9.6-eclipse-temurin-21

stages:
  - build_test
  - security_iac
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  AWS_DEFAULT_REGION: "ap-southeast-1"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"

# -----------------------------------------------------------------------------
# Stage 1: Build & Test (Parallel)
# -----------------------------------------------------------------------------
build_backend:
  stage: build_test
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
  script:
    - echo "Building and Testing Java Microservices..."
    - mvn -f backend/pom.xml -T 1C clean package
  artifacts:
    paths:
      - backend/product-service/target/*.jar
      - backend/inventory-service/target/*.jar
      - backend/cart-service/target/*.jar
      - backend/order-service/target/*.jar
      - backend/payment-service/target/*.jar
    expire_in: 1 week

build_frontend:
  stage: build_test
  cache:
    key: "frontend-${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/node_modules/
  script:
    - echo "Building and Testing React Frontend..."
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm test
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# -----------------------------------------------------------------------------
# Stage 2: Security & IaC (Parallel)
# -----------------------------------------------------------------------------
sonarqube_analysis:
  stage: security_iac
  cache:
    key: "backend-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
    policy: pull
  script:
    - echo "Running SonarQube static code analysis..."
    - mvn -f backend/pom.xml compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" "-Dsonar.organization=$env:SONAR_ORG" "-Dsonar.host.url=$env:SONAR_HOST_URL" "-Dsonar.token=$env:SONAR_TOKEN"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

snyk_analysis:
  stage: security_iac
  cache:
    - key: "backend-${CI_COMMIT_REF_SLUG}"
      paths:
        - .m2/repository
      policy: pull
    - key: "frontend-${CI_COMMIT_REF_SLUG}"
      paths:
        - frontend/node_modules/
      policy: pull
    - key: "tools-cache"
      paths:
        - .tools/
  script:
    - |
      if ([string]::IsNullOrEmpty($env:SNYK_TOKEN)) {
        Write-Host "SNYK_TOKEN is not set or empty. Skipping Snyk scan..."
        exit 0
      }
    - New-Item -ItemType Directory -Force -Path ".tools" | Out-Null
    - if (-not (Test-Path ".tools\snyk.exe")) { Write-Host "Downloading Snyk CLI..."; Invoke-WebRequest -Uri "https://static.snyk.io/cli/latest/snyk-win.exe" -OutFile ".tools\snyk.exe" }
    - .\.tools\snyk.exe config set api="$env:SNYK_TOKEN"
    - .\.tools\snyk.exe test --all-projects --severity-threshold=high --report ; if ($LASTEXITCODE -ne 0) { Write-Host "Snyk test found issues" }
    - .\.tools\snyk.exe iac test terraform/ --severity-threshold=high --report ; if ($LASTEXITCODE -ne 0) { Write-Host "Snyk IaC test found issues" }
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

terraform_plan:
  stage: security_iac
  cache:
    - key: "terraform-${CI_COMMIT_REF_SLUG}"
      paths:
        - .terraform.d/plugin-cache
    - key: "tools-cache"
      paths:
        - .tools/
  script:
    - New-Item -ItemType Directory -Force -Path ".tools" | Out-Null
    - if (-not (Test-Path ".tools\terraform.exe")) { Write-Host "Downloading Terraform..."; Invoke-WebRequest -Uri "https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_windows_amd64.zip" -OutFile "terraform.zip"; Expand-Archive -Path "terraform.zip" -DestinationPath ".tools" -Force }
    - cd terraform
    - New-Item -ItemType Directory -Force -Path $env:TF_PLUGIN_CACHE_DIR | Out-Null
    - ..\.tools\terraform.exe init -backend=false
    - ..\.tools\terraform.exe validate
    - ..\.tools\terraform.exe plan -parallelism=30
  artifacts:
    name: terraform-plan
    paths:
      - terraform/

# -----------------------------------------------------------------------------
# Stage 3: Deploy (Parallel)
# -----------------------------------------------------------------------------
deploy_backend:
  stage: deploy
  script:
    - echo "Deploying updated code to existing Lambda functions sequentially..."
    - aws lambda update-function-code --function-name L_ProductService --zip-file fileb://backend/product-service/target/product-service-1.0.0.jar
    - aws lambda update-function-code --function-name L_InventoryService --zip-file fileb://backend/inventory-service/target/inventory-service-1.0.0.jar
    - aws lambda update-function-code --function-name L_InventoryEventService --zip-file fileb://backend/inventory-service/target/inventory-service-1.0.0.jar
    - aws lambda update-function-code --function-name L_CartService --zip-file fileb://backend/cart-service/target/cart-service-1.0.0.jar
    - aws lambda update-function-code --function-name L_OrderService --zip-file fileb://backend/order-service/target/order-service-1.0.0.jar
    - aws lambda update-function-code --function-name L_PaymentService --zip-file fileb://backend/payment-service/target/payment-service-1.0.0.jar
    - aws lambda update-function-code --function-name L_PaymentEventService --zip-file fileb://backend/payment-service/target/payment-service-1.0.0.jar
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

deploy_frontend:
  stage: deploy
  script:
    - 'echo "Syncing dist/ directory to existing S3 bucket: l-frontend..."'
    - 'aws s3 sync frontend/dist/ s3://l-frontend/ --delete'
    - 'echo "Invalidating CloudFront cache for distribution ${CLOUDFRONT_DISTRIBUTION_ID}..."'
    - 'aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"'
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
