default:
  tags:
    - windows
  image: maven:3.9.6-eclipse-temurin-21
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
      - frontend/node_modules/
      - .terraform.d/plugin-cache

stages:
  - validate
  - build
  - test
  - sonarqube
  - snyk
  - terraform_validate
  - terraform_plan
  - deploy_backend
  - deploy_frontend
  - cloudfront_invalidation

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  AWS_DEFAULT_REGION: "ap-southeast-1"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"

# -----------------------------------------------------------------------------
# Stage 1: Validate
# -----------------------------------------------------------------------------
validate:
  stage: validate
  script:
    - echo "Validating Java Maven project configuration..."
    - mvn -T 1C validate

# -----------------------------------------------------------------------------
# Stage 2: Build
# -----------------------------------------------------------------------------
build_backend:
  stage: build
  script:
    - echo "Building Java 21 Microservices JARs..."
    - mvn -T 1C clean package -DskipTests
  artifacts:
    paths:
      - product-service/target/*.jar
      - inventory-service/target/*.jar
      - cart-service/target/*.jar
      - order-service/target/*.jar
      - payment-service/target/*.jar
    expire_in: 1 week

build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - echo "Building React + Vite frontend application..."
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# -----------------------------------------------------------------------------
# Stage 3: Test
# -----------------------------------------------------------------------------
test_backend:
  stage: test
  script:
    - echo "Executing Java unit tests..."
    - mvn -T 1C test

test_frontend:
  stage: test
  image: node:20-alpine
  script:
    - echo "Executing React unit tests..."
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm test

# -----------------------------------------------------------------------------
# Stage 4: SonarQube
# -----------------------------------------------------------------------------
sonarqube_analysis:
  stage: sonarqube
  script:
    - echo "Running SonarQube static code analysis..."
    - mvn compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.organization=${SONAR_ORG} -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN}
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

# -----------------------------------------------------------------------------
# Stage 4.5: Snyk
# -----------------------------------------------------------------------------
snyk_analysis:
  stage: snyk
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - |
      if [ -z "$SNYK_TOKEN" ]; then
        echo "SNYK_TOKEN is not set or empty. Please add a valid token to your GitLab CI/CD Variables. Skipping Snyk scan..."
        exit 0
      fi
    - echo "Downloading Snyk CLI..."
    - curl -Lo /usr/local/bin/snyk "https://static.snyk.io/cli/latest/snyk-linux"
    - chmod +x /usr/local/bin/snyk
    - echo "Authenticating with Snyk..."
    - snyk config set api="${SNYK_TOKEN}"
    - echo "Running Snyk Open Source Scan..."
    - snyk test --all-projects --severity-threshold=high --report || true
    - snyk monitor --all-projects
    - echo "Running Snyk IaC Scan on Terraform..."
    - snyk iac test terraform/ --severity-threshold=high --report || true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

# -----------------------------------------------------------------------------
# Stage 5: Terraform Validate
# -----------------------------------------------------------------------------
terraform_validate:
  stage: terraform_validate
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  script:
    - cd terraform
    - mkdir -p $TF_PLUGIN_CACHE_DIR
    - terraform init -backend=false
    - terraform validate

# -----------------------------------------------------------------------------
# Stage 6: Terraform Plan
# -----------------------------------------------------------------------------
terraform_plan:
  stage: terraform_plan
  image:
    name: hashicorp/terraform:1.10
    entrypoint: [""]
  script:
    - cd terraform
    - mkdir -p $TF_PLUGIN_CACHE_DIR
    - terraform init -backend=false
    - terraform plan -parallelism=30
  artifacts:
    name: terraform-plan
    paths:
      - terraform/

# -----------------------------------------------------------------------------
# Stage 7: Deploy Backend (Lambda Update)
# -----------------------------------------------------------------------------
deploy_backend:
  stage: deploy_backend
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - echo "Deploying updated code to existing Lambda functions simultaneously..."
    - aws lambda update-function-code --function-name L_ProductService --zip-file fileb://product-service/target/product-service-1.0.0.jar &
    - aws lambda update-function-code --function-name L_InventoryService --zip-file fileb://inventory-service/target/inventory-service-1.0.0.jar &
    - aws lambda update-function-code --function-name L_InventoryEventService --zip-file fileb://inventory-service/target/inventory-service-1.0.0.jar &
    - aws lambda update-function-code --function-name L_CartService --zip-file fileb://cart-service/target/cart-service-1.0.0.jar &
    - aws lambda update-function-code --function-name L_OrderService --zip-file fileb://order-service/target/order-service-1.0.0.jar &
    - aws lambda update-function-code --function-name L_PaymentService --zip-file fileb://payment-service/target/payment-service-1.0.0.jar &
    - aws lambda update-function-code --function-name L_PaymentEventService --zip-file fileb://payment-service/target/payment-service-1.0.0.jar &
    - wait
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

# -----------------------------------------------------------------------------
# Stage 8: Deploy Frontend (S3 Upload)
# -----------------------------------------------------------------------------
deploy_frontend:
  stage: deploy_frontend
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - 'echo "Syncing dist/ directory to existing S3 bucket: l-frontend..."'
    - 'aws s3 sync frontend/dist/ s3://l-frontend/ --delete'
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

# -----------------------------------------------------------------------------
# Stage 9: CloudFront Invalidation
# -----------------------------------------------------------------------------
cloudfront_invalidation:
  stage: cloudfront_invalidation
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - 'echo "Invalidating CloudFront cache for distribution ${CLOUDFRONT_DISTRIBUTION_ID}..."'
    - 'aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"'
  rules:
    - if: $CI_COMMIT_BRANCH == "terraform" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
